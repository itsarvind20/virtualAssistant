<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg { fill: #fafafa; }
      .head { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; rx: 12; }
      .life { stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 6 6; }
      .msg { stroke: #7c3aed; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .text { font: 700 17px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .note { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text x="600" y="45" text-anchor="middle" class="title">Calendar Event Creation Result Flow</text>

  <rect x="90" y="85" width="170" height="55" class="head"/>
  <text x="175" y="119" text-anchor="middle" class="text">User</text>
  <rect x="380" y="85" width="170" height="55" class="head"/>
  <text x="465" y="119" text-anchor="middle" class="text">Frontend</text>
  <rect x="670" y="85" width="170" height="55" class="head"/>
  <text x="755" y="119" text-anchor="middle" class="text">Backend</text>
  <rect x="960" y="85" width="170" height="55" class="head"/>
  <text x="1045" y="119" text-anchor="middle" class="text">Google Calendar</text>

  <line x1="175" y1="140" x2="175" y2="595" class="life"/>
  <line x1="465" y1="140" x2="465" y2="595" class="life"/>
  <line x1="755" y1="140" x2="755" y2="595" class="life"/>
  <line x1="1045" y1="140" x2="1045" y2="595" class="life"/>

  <path class="msg" d="M175 185 L465 185"/>
  <text x="320" y="176" text-anchor="middle" class="small">"Add meeting tomorrow at 5 PM"</text>

  <rect x="365" y="215" width="200" height="55" class="note"/>
  <text x="465" y="238" text-anchor="middle" class="small">Parse calendar intent</text>
  <text x="465" y="258" text-anchor="middle" class="small">and prepare payload</text>

  <path class="msg" d="M465 310 L755 310"/>
  <text x="610" y="301" text-anchor="middle" class="small">Prepare event request</text>

  <path class="msg" d="M755 365 L465 365"/>
  <text x="610" y="356" text-anchor="middle" class="small">Return confirmation message</text>

  <path class="msg" d="M465 420 L175 420"/>
  <text x="320" y="411" text-anchor="middle" class="small">"Should I create this event?"</text>

  <path class="msg" d="M175 475 L465 475"/>
  <text x="320" y="466" text-anchor="middle" class="small">"Yes"</text>

  <path class="msg" d="M465 525 L755 525"/>
  <text x="610" y="516" text-anchor="middle" class="small">Create confirmed event</text>

  <path class="msg" d="M755 565 L1045 565"/>
  <text x="900" y="556" text-anchor="middle" class="small">Google Calendar API call</text>

  <path class="msg" d="M1045 605 L175 605"/>
  <text x="610" y="628" text-anchor="middle" class="small">Success response: event added and assistant speaks confirmation</text>
</svg>
