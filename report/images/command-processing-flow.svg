<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <style>
      .bg { fill: #fbfbfb; }
      .box { fill: #ffffff; stroke: #0f766e; stroke-width: 2; rx: 12; }
      .decision { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .end { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .line { stroke: #0f766e; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .label { font: 13px Arial, sans-serif; fill: #0f766e; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="600" y="45" text-anchor="middle" class="title">Command Processing Flow</text>

  <rect x="490" y="80" width="220" height="65" class="box"/>
  <text x="600" y="118" text-anchor="middle" class="text">Voice/Text Command</text>

  <rect x="490" y="185" width="220" height="65" class="box"/>
  <text x="600" y="224" text-anchor="middle" class="text">Normalize Text</text>

  <polygon points="600,295 735,365 600,435 465,365" class="decision"/>
  <text x="600" y="360" text-anchor="middle" class="text">Local Intent?</text>
  <text x="600" y="383" text-anchor="middle" class="small">pause, resume, app, music</text>

  <rect x="120" y="330" width="230" height="70" class="box"/>
  <text x="235" y="359" text-anchor="middle" class="text">Execute Direct Action</text>
  <text x="235" y="382" text-anchor="middle" class="small">browser, media, desktop</text>

  <polygon points="600,475 735,545 600,615 465,545" class="decision"/>
  <text x="600" y="540" text-anchor="middle" class="text">Calendar Intent?</text>
  <text x="600" y="563" text-anchor="middle" class="small">create, view, update, delete</text>

  <rect x="120" y="510" width="230" height="70" class="box"/>
  <text x="235" y="539" text-anchor="middle" class="text">Prepare Calendar</text>
  <text x="235" y="562" text-anchor="middle" class="small">confirm if needed</text>

  <rect x="850" y="510" width="230" height="70" class="box"/>
  <text x="965" y="539" text-anchor="middle" class="text">Backend AI Parser</text>
  <text x="965" y="562" text-anchor="middle" class="small">classify command type</text>

  <rect x="490" y="665" width="220" height="65" class="end"/>
  <text x="600" y="690" text-anchor="middle" class="text">Speak Response</text>
  <text x="600" y="714" text-anchor="middle" class="small">update assistant UI state</text>

  <path class="line" d="M600 145 L600 185"/>
  <path class="line" d="M600 250 L600 295"/>
  <path class="line" d="M465 365 L350 365"/>
  <text x="385" y="350" class="label">Yes</text>
  <path class="line" d="M600 435 L600 475"/>
  <text x="615" y="460" class="label">No</text>
  <path class="line" d="M465 545 L350 545"/>
  <text x="385" y="530" class="label">Yes</text>
  <path class="line" d="M735 545 L850 545"/>
  <text x="780" y="530" class="label">No</text>
  <path class="line" d="M235 400 C235 690 480 698 490 698"/>
  <path class="line" d="M235 580 C235 710 460 704 490 704"/>
  <path class="line" d="M965 580 C965 710 740 704 710 704"/>
</svg>
