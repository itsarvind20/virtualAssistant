<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #1e40af; stroke-width: 2; rx: 14; }
      .box2 { fill: #eef6ff; stroke: #0284c7; stroke-width: 2; rx: 14; }
      .box3 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .text { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .line { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="600" y="45" text-anchor="middle" class="title">Virtual Assistant System Architecture</text>

  <rect x="55" y="240" width="160" height="90" class="box"/>
  <text x="135" y="278" text-anchor="middle" class="text">User</text>
  <text x="135" y="304" text-anchor="middle" class="small">Voice or text</text>

  <rect x="285" y="180" width="230" height="190" class="box2"/>
  <text x="400" y="222" text-anchor="middle" class="text">React Frontend</text>
  <text x="400" y="252" text-anchor="middle" class="small">Assistant UI</text>
  <text x="400" y="275" text-anchor="middle" class="small">Wake word detection</text>
  <text x="400" y="298" text-anchor="middle" class="small">Speech recognition</text>
  <text x="400" y="321" text-anchor="middle" class="small">Text command input</text>

  <rect x="610" y="180" width="230" height="190" class="box"/>
  <text x="725" y="222" text-anchor="middle" class="text">Node/Express Backend</text>
  <text x="725" y="252" text-anchor="middle" class="small">API routes</text>
  <text x="725" y="275" text-anchor="middle" class="small">Command processing</text>
  <text x="725" y="298" text-anchor="middle" class="small">Authentication</text>
  <text x="725" y="321" text-anchor="middle" class="small">Calendar controller</text>

  <rect x="930" y="95" width="180" height="75" class="box3"/>
  <text x="1020" y="126" text-anchor="middle" class="text">MongoDB</text>
  <text x="1020" y="150" text-anchor="middle" class="small">Users, history</text>

  <rect x="930" y="205" width="180" height="75" class="box3"/>
  <text x="1020" y="236" text-anchor="middle" class="text">Groq AI</text>
  <text x="1020" y="260" text-anchor="middle" class="small">Intent parsing</text>

  <rect x="930" y="315" width="180" height="75" class="box3"/>
  <text x="1020" y="346" text-anchor="middle" class="text">Cloudinary</text>
  <text x="1020" y="370" text-anchor="middle" class="small">Avatar upload</text>

  <rect x="930" y="425" width="180" height="75" class="box3"/>
  <text x="1020" y="456" text-anchor="middle" class="text">Google Calendar</text>
  <text x="1020" y="480" text-anchor="middle" class="small">Events API</text>

  <rect x="570" y="455" width="290" height="75" class="box2"/>
  <text x="715" y="486" text-anchor="middle" class="text">Browser/Desktop Actions</text>
  <text x="715" y="510" text-anchor="middle" class="small">YouTube, music, apps, search</text>

  <path class="line" d="M215 285 L285 285"/>
  <path class="line" d="M515 285 L610 285"/>
  <path class="line" d="M840 225 L930 135"/>
  <path class="line" d="M840 250 L930 242"/>
  <path class="line" d="M840 300 L930 352"/>
  <path class="line" d="M840 330 L930 462"/>
  <path class="line" d="M725 370 L725 455"/>
  <path class="line" d="M610 315 L515 315"/>
</svg>
